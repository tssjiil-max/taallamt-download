<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فحص أحجام تجربة شكابمبو</title><style>body{font-family:Tahoma,sans-serif;margin:16px;background:#eef4fa;color:#142d4a}h1{font-size:18px}main{display:flex;gap:12px;align-items:start;flex-wrap:wrap}.frame{flex:none}iframe{border:1px solid #bad0e4;height:800px;display:block;background:#fff}p{font-size:13px}button{padding:12px;margin:5px;cursor:pointer}</style><h1>فحص استجابة النسخة التجريبية — بيانات اصطناعية فقط</h1><p>كل إطار نافذة متصفح مستقلة بعرضها الفعلي؛ هذا فحص أحجام CSS، وليس محاكاة نظام Android أو تسجيل دخول المعلم.</p><nav><button data-route="">الرئيسية</button><button data-route="plan">الخطة</button><button data-route="learning">شكابمبو والقرآن</button><button data-route="settings">الإعدادات</button></nav><main></main><script>
const main=document.querySelector('main');for(const width of [360,390,430]){const box=document.createElement('section');box.className='frame';const title=document.createElement('h2');title.textContent=width+' بكسل';const frame=document.createElement('iframe');frame.width=width;frame.title='طالب تجريبي بعرض '+width;frame.src='/student?studentId=__shakabumbo_demo__&pilot=1&demoSession=viewport-'+width;box.append(title,frame);main.append(box)}document.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>document.querySelectorAll('iframe').forEach(frame=>{frame.src=frame.src.split('#')[0]+'#'+button.dataset.route})))
</script></html>
