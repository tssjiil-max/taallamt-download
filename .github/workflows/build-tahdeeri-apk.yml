name: Build Tahdeeri Weekly APK

on:
  push:
    branches:
      - tool/tahdeeri-mobile-lite
    paths:
      - 'android-tahdeeri/**'
      - '.github/workflows/build-tahdeeri-apk.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'android-tahdeeri/**'
      - '.github/workflows/build-tahdeeri-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tahdeeri
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tahdeeri-weekly-lite-apk
          path: android-tahdeeri/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
