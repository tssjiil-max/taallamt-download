name: Student Parent Visual Preview CI
on:
  push:
    branches:
      - codex/student-parent-visual-safe-20261001
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build
