name: Netlify Backend Status Check

on:
  push:
    branches:
      - feature/student-live-sync-functions-v1
    paths:
      - .github/workflows/netlify-backend-status-check.yml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Netlify staging backend status
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --max-time 30 https://taallamt-staging.netlify.app/api/backend-status)"
          STATUS="$response" node - <<'NODE'
          const status = JSON.parse(process.env.STATUS || '{}');
          console.log(JSON.stringify({
            ok: status.ok,
            environment: status.environment,
            workspaceId: status.workspaceId,
            firebaseAdminConfigured: status.firebaseAdminConfigured,
            base64ServiceAccount: status.base64ServiceAccount
          }));
          if (status.ok !== true) process.exit(11);
          if (status.environment !== 'staging') process.exit(12);
          if (status.firebaseAdminConfigured !== true) process.exit(13);
          if (status.base64ServiceAccount !== true) process.exit(14);
          NODE
