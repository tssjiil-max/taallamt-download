name: Student Live Sync CI
on:
  pull_request:
    branches: ["feature/lesson-session-shakabambo-v2"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Unit and regression tests
        run: npm test
      - name: Full project build
        run: npm run build
      - name: Live Netlify staging smoke
        env:
          TAALLAMT_STAGING_URL: https://taallamt-staging.netlify.app
        run: |
          node --input-type=module <<'NODE'
          const base=process.env.TAALLAMT_STAGING_URL;
          async function req(path,options={}){
            const r=await fetch(base+path,{redirect:'follow',...options});
            const text=await r.text();
            if(!r.ok) throw new Error(`${path} -> HTTP ${r.status}: ${text.slice(0,180)}`);
            return {r,text,json:()=>JSON.parse(text)};
          }
          const home=await req('/');
          if(!home.text.includes('id="root"')) throw new Error('HOME_ROOT_MISSING');
          const lesson=await req('/teacher/lesson');
          if(!lesson.text.includes('id="root"')) throw new Error('LESSON_ROOT_MISSING');
          const status=(await req('/api/backend-status')).json();
          if(status.ok!==true||status.environment!=='staging'||status.workspaceId!=='second-4'||status.firebaseAdminConfigured!==true) throw new Error('BACKEND_STATUS_INVALID '+JSON.stringify(status));
          const action=(await req('/api/action-smoke')).json();
          if(action.ok!==true||action.cleanup!==true||action.productionProtected!==true||!action.checks||Object.values(action.checks).some(v=>v!==true)) throw new Error('ACTION_SMOKE_INVALID '+JSON.stringify({ok:action.ok,checks:action.checks,cleanup:action.cleanup}));
          const stateSmoke=(await req('/api/student-state?action=smoke')).json();
          if(stateSmoke.ok!==true) throw new Error('STUDENT_STATE_SMOKE_INVALID '+JSON.stringify(stateSmoke));
          const snapshot=(await req('/api/student-state?studentId=s2-4-02')).json();
          if(snapshot.ok!==true||snapshot.student?.id!=='s2-4-02') throw new Error('STUDENT_SNAPSHOT_INVALID');
          for(const key of ['assessments','homework','homeworkEvidence','communications','announcements']) if(!Array.isArray(snapshot[key])) throw new Error(`STUDENT_SNAPSHOT_${key.toUpperCase()}_INVALID`);
          const preview=(await req('/api/learning-automation?action=preview')).json();
          if(preview.ok!==true||!preview.content) throw new Error('LEARNING_PREVIEW_INVALID');
          const ar=await fetch(base+'/api/lesson-assistant',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'teacher',question:'أعطني سؤالًا شفهيًا قصيرًا مناسبًا لهذا الهدف.',context:{subject:'islamic',subjectLabel:'الدراسات الإسلامية',unit:'أسماء الله وصفاته',lesson:'الله السميع البصير',skill:'تمييز أثر الإيمان بالاسمين',gradeLabel:'الثاني',classLabel:'4'}})});
          const at=await ar.text(); let aj={}; try{aj=JSON.parse(at)}catch{}
          if(!(ar.ok&&typeof aj.answer==='string'&&aj.answer.trim()) && !(ar.status===503&&aj?.error==='ASSISTANT_UNAVAILABLE')) throw new Error(`ASSISTANT_INVALID HTTP ${ar.status}: ${at.slice(0,180)}`);
          console.log(JSON.stringify({ok:true,home:true,lesson:true,backend:true,firebase:true,actionSmoke:true,studentState:true,studentSnapshot:true,learningPreview:true,assistant:ar.ok?'remote':'local-fallback'}));
          NODE
      - name: Pack source for Netlify staging
        run: tar --exclude='.git' --exclude='node_modules' --exclude='dist' -czf /tmp/taallamt-netlify-source.tgz .
      - name: Upload Netlify source artifact
        uses: actions/upload-artifact@v4
        with:
          name: taallamt-netlify-source
          path: /tmp/taallamt-netlify-source.tgz
          retention-days: 1
