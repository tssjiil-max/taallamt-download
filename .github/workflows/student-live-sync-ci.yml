name: Student Live Sync CI
on:
  pull_request:
    branches: ["feature/lesson-session-shakabambo-v2"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Unit and regression tests
        run: npm test
      - name: Full project build
        run: npm run build
      - name: Diagnose Netlify staging API routing
        env:
          TAALLAMT_STAGING_URL: https://taallamt-staging.netlify.app
        run: |
          node --input-type=module <<'NODE'
          const base=process.env.TAALLAMT_STAGING_URL;
          async function raw(path){
            const r=await fetch(base+path,{redirect:'follow'});
            const text=await r.text();
            let json=null; try{json=JSON.parse(text)}catch{}
            return {status:r.status,text,json};
          }
          const home=await raw('/');
          const lesson=await raw('/teacher/lesson');
          if(home.status!==200||!home.text.includes('id="root"')) throw new Error('HOME_INVALID');
          if(lesson.status!==200||!lesson.text.includes('id="root"')) throw new Error('LESSON_INVALID');
          const publicStatus=await raw('/api/backend-status');
          const directStatus=await raw('/.netlify/functions/api?path=backend-status');
          console.log('PUBLIC_BACKEND',JSON.stringify({status:publicStatus.status,error:publicStatus.json?.error}));
          console.log('DIRECT_BACKEND',JSON.stringify({status:directStatus.status,ok:directStatus.json?.ok,environment:directStatus.json?.environment,workspaceId:directStatus.json?.workspaceId,firebaseAdminConfigured:directStatus.json?.firebaseAdminConfigured,base64ServiceAccount:directStatus.json?.base64ServiceAccount,error:directStatus.json?.error}));
          if(directStatus.status!==200||directStatus.json?.ok!==true) throw new Error('DIRECT_BACKEND_FAILED');
          const action=await raw('/.netlify/functions/api?path=action-smoke');
          console.log('DIRECT_ACTION_SMOKE',JSON.stringify({status:action.status,ok:action.json?.ok,checks:action.json?.checks,cleanup:action.json?.cleanup,productionProtected:action.json?.productionProtected,error:action.json?.error}));
          if(action.status!==200||action.json?.ok!==true||action.json?.cleanup!==true) throw new Error('DIRECT_ACTION_SMOKE_FAILED');
          const state=await raw('/.netlify/functions/api?path=student-state&action=smoke');
          console.log('DIRECT_STATE_SMOKE',JSON.stringify({status:state.status,ok:state.json?.ok,write:state.json?.write,read:state.json?.read,delete:state.json?.delete,error:state.json?.error}));
          if(state.status!==200||state.json?.ok!==true) throw new Error('DIRECT_STATE_SMOKE_FAILED');
          console.log('ROUTING_DIAGNOSIS',JSON.stringify({home:true,lesson:true,publicApiStatus:publicStatus.status,directFunction:true,firebaseWriteReadCleanup:true}));
          NODE
      - name: Pack source for Netlify staging
        run: tar --exclude='.git' --exclude='node_modules' --exclude='dist' -czf /tmp/taallamt-netlify-source.tgz .
      - name: Upload Netlify source artifact
        uses: actions/upload-artifact@v4
        with:
          name: taallamt-netlify-source
          path: /tmp/taallamt-netlify-source.tgz
          retention-days: 1
