name: Netlify Action Smoke Check

on:
  push:
    branches:
      - feature/student-live-sync-functions-v1
    paths:
      - .github/workflows/netlify-action-smoke-check.yml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Run staging Firebase smoke test
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --max-time 60 https://taallamt-staging.netlify.app/api/action-smoke)"
          STATUS="$response" node - <<'NODE'
          const status = JSON.parse(process.env.STATUS || '{}');
          console.log(JSON.stringify({ok:status.ok,checks:status.checks,cleanup:status.cleanup,productionProtected:status.productionProtected}));
          if (status.ok !== true) process.exit(21);
          if (status.cleanup !== true) process.exit(22);
          if (!status.checks || Object.values(status.checks).some(v => v !== true)) process.exit(23);
          NODE
