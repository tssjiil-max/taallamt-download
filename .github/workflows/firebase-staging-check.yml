name: Firebase migration staging guard
on:
  pull_request:
  push:
    branches: ['migration/firebase-hosting-staging-20261025']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-staging-template:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test metadata-only identity guard
        run: python -m unittest discover -s tests -p '*_test.py' -v
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - name: Validate safe staging-only Firebase template
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const p = 'deployment/firebase.staging.template.json';
          const c = JSON.parse(fs.readFileSync(p, 'utf8'));
          assert.equal(c.hosting.public, 'dist');
          assert.ok(!('project' in c), 'Do not hardcode a Firebase project');
          assert.ok(!fs.existsSync('firebase.json'), 'Do not add deployable Firebase config until the actual project is verified');
          const rules = c.hosting.rewrites;
          assert.deepEqual(rules[0].source, '/api/**');
          assert.ok(rules[0].run.serviceId.startsWith('REPLACE_WITH_VERIFIED_'));
          assert.ok(rules[0].run.region.startsWith('REPLACE_WITH_VERIFIED_'));
          for (const path of ['/teacher/student/**','/teacher/students','/teacher/library','/teacher/settings','/teacher/announcements','/teacher/tasks','/teacher/followup','/teacher/messages','/teacher/stars']) {
            assert.equal(rules.find(r => r.source === path)?.destination, '/legacy.html', path);
          }
          assert.deepEqual(rules.at(-1), {source:'**',destination:'/index.html'});
          assert.ok(!('functions' in c), 'Backend not yet configured; do not imply migration complete');
          console.log('Staging-only routing template checks passed. No deployment authorized.');
          NODE
  audit-firebase-identity:
    name: Owner-enabled read-only Firebase audit
    needs: validate-staging-template
    if: >-
      github.repository == 'tssjiil-max/taallamt-download' &&
      github.ref == 'refs/heads/migration/firebase-hosting-staging-20261025' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.TAALLAMT_WIF_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: firebase-migration-audit
    permissions:
      contents: read
      id-token: write
    env:
      TAALLAMT_FIREBASE_PROJECT_ID: ${{ vars.TAALLAMT_FIREBASE_PROJECT_ID }}
      TAALLAMT_FIREBASE_PROJECT_NUMBER: ${{ vars.TAALLAMT_FIREBASE_PROJECT_NUMBER }}
      TAALLAMT_FIREBASE_WEB_APP_ID: ${{ vars.TAALLAMT_FIREBASE_WEB_APP_ID }}
      TAALLAMT_WIF_PROVIDER: ${{ vars.TAALLAMT_WIF_PROVIDER }}
      TAALLAMT_AUDIT_SERVICE_ACCOUNT: ${{ vars.TAALLAMT_AUDIT_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject unrelated projects before requesting credentials
        run: python scripts/firebase-project-audit.py --validate-only
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.TAALLAMT_FIREBASE_PROJECT_ID }}
          workload_identity_provider: ${{ vars.TAALLAMT_WIF_PROVIDER }}
          service_account: ${{ vars.TAALLAMT_AUDIT_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 600s
          create_credentials_file: false
      - name: Read project, web-app, Hosting and database metadata only
        env:
          GOOGLE_AUDIT_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python scripts/firebase-project-audit.py
      - name: Save sanitized identity evidence only
        uses: actions/upload-artifact@v4
        with:
          name: firebase-metadata-${{ github.sha }}
          path: migration-evidence/firebase-project-metadata.json
          if-no-files-found: error
          retention-days: 7
