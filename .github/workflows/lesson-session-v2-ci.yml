name: Lesson Session V2 CI
on:
  push:
    branches: ["feature/lesson-session-shakabambo-v2"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Unit and regression tests
        run: npm test
      - name: Full project build
        run: npm run build
      - name: Preview smoke
        env:
          TAALLAMT_PREVIEW_URL: https://taallamt-teacher-git-feature-lesson-session-091b44-tssjiil-2953.vercel.app
        run: node scripts/lesson-preview-smoke.mjs
