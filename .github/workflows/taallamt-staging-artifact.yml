name: Taallamt Staging Artifact
on:
  push:
    branches:
      - staging/student-teacher-final-20261002
  workflow_dispatch:

jobs:
  build-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: taallamt-staging-dist
          path: dist
          if-no-files-found: error
