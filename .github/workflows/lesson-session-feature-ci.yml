name: Lesson Session Feature CI
on:
  push:
    branches: ["feature/lesson-session-shakabambo"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Unit and regression tests
        run: npm test
      - name: TypeScript compile check
        run: npx tsc
      - name: Vite production bundle check
        run: npx vite build
      - name: Known baseline student vector regression
        continue-on-error: true
        run: node scripts/student-vector-assets-regression.mjs
